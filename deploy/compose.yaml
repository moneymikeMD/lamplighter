services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: lamplighter
      POSTGRES_DB: lamplighter
      POSTGRES_PASSWORD: ${LAMPLIGHTER_DB_PASSWORD:?set LAMPLIGHTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamplighter -d lamplighter"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    image: ghcr.io/moneymikemd/lamplighter:${LAMPLIGHTER_VERSION:-latest}
    user: "0:0"
    entrypoint: ["sh", "-c", "touch /state/keys && chmod 600 /state/keys && chown 10001 /state /state/keys /home/lampl/.cache"]
    volumes:
      - state:/state
      - models:/home/lampl/.cache
    restart: "no"

  lampl:
    image: ghcr.io/moneymikemd/lamplighter:${LAMPLIGHTER_VERSION:-latest}
    command: ["serve", "--listen", "0.0.0.0:7878"]
    environment:
      LAMPL_DATABASE_URL: postgres://lamplighter:${LAMPLIGHTER_DB_PASSWORD}@postgres:5432/lamplighter
      LAMPL_KEYS_FILE: /state/keys
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - state:/state
      - models:/home/lampl/.cache
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
  state:
  models:
