name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Plugin dependency ranges resolve against lamplighter--vX.Y.Z tags; release-please tags vX.Y.Z.
      - name: Add the lamplighter--v tag for the plugin
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ref="refs/tags/lamplighter--${RELEASE_TAG}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/lamplighter--${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${ref} already exists"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="${ref}" -f sha="${RELEASE_SHA}"
          fi

      # release-please cannot address Cargo.lock entries, so the lockfile is synced on the release branch.
      # The PR JSON is parsed in the script: on a release commit `pr` can be empty, and fromJSON('') fails the whole job.
      - name: Sync Cargo.lock on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r '.headBranchName // empty' <<<"${PR_JSON:-}" 2>/dev/null || true)
          if [ -z "${BRANCH}" ]; then
            echo "no release PR branch in this run; nothing to sync"
            exit 0
          fi
          git clone --quiet --depth 1 --branch "${BRANCH}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rp
          cd rp
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already matches"
            exit 0
          fi
          git -c user.name='moneymike-release[bot]' -c user.email='353580701+moneymike-release[bot]@users.noreply.github.com' \
            commit --quiet -m 'chore: sync Cargo.lock to the release version' Cargo.lock
          git push --quiet origin "HEAD:${BRANCH}"
