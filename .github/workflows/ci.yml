name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude lampl-store-pg -- --skip pg_
      - run: cargo build --release -p lampl
      - name: No onnxruntime linkage
        run: |
          if [ "$(uname)" = Darwin ]; then linked=$(otool -L target/release/lampl); else linked=$(ldd target/release/lampl); fi
          echo "$linked"
          ! grep -qi onnxruntime <<<"$linked"
  store-pg:
    name: store-pg (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LAMPL_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test -p lampl-core -p lampl-store-pg -- --nocapture
      - run: cargo test -p lampl --test serve_http -- --nocapture
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: typos@1.52.0,cargo-shear@1.14.0,cargo-deny@0.20.2
      - name: Install lefthook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2.2 --repo evilmartians/lefthook --pattern lefthook_2.2.2_Linux_x86_64 -O lefthook
          sudo install -m 0755 lefthook /usr/local/bin/lefthook
          lefthook version
      - run: lefthook run pre-commit --all-files
      - name: Plugin hook selftest
        run: python3 plugin/hooks/selftest.py
