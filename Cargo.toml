[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/moneymikeMD/lamplighter"
rust-version = "1.99"
publish = true

[workspace.dependencies]
fastembed = { version = "7.6.1", default-features = false, features = ["qwen3-text"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.1", features = ["json"] }
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
