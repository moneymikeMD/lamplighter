[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/lampl-pg-ext"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/moneymikeMD/lamplighter"
rust-version = "1.99"
publish = true

[workspace.dependencies]
fastembed = { version = "7.6.1", default-features = false, features = ["qwen3-text"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
serde_json = "1.0.154"
rust-stemmers = "1.2.0"
thiserror = "2.0.21"
ureq = { version = "3.5.1", features = ["json"] }
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
pgvector = { version = "0.4.2", features = ["sqlx", "halfvec"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.1", features = ["serde", "v5", "v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
futures-util = { version = "0.3.34", default-features = false }
tower = "0.5.3"
http-body-util = "0.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlite-vec = "=0.1.9"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
toml = "1.2.1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
