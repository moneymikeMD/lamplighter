[package]
name = "lampl-pg-ext"
description = "Experimental pgrx extension that embeds lamplighter memories inside Postgres"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/moneymikeMD/lamplighter"
rust-version = "1.99"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg13 = ["pgrx/pg13"]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]

[dependencies]
lampl-embed = { path = "../lampl-embed" }
pgrx = "0.19.3"

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
