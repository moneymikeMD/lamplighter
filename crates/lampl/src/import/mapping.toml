# memorygraph -> lamplighter. Data, not code: edit here and in docs/migrating-from-memorygraph.md together.
# The original memorygraph type is also kept as a `memorygraph:<type>` tag on each imported memory.

[types]
problem = "problem"
error = "problem"
solution = "fix"
fix = "fix"
code_pattern = "procedure"
workflow = "procedure"
command = "procedure"
general = "fact"
conversation = "fact"
technology = "fact"
project = "fact"
task = "fact"
file_context = "fact"

# A link type maps to a lean link type (itself or another, direction kept) or to "dropped" (counted in the import report, never written).
# A type absent from this table is dropped and counted by name in the report; it does not fail the import.
[links]
SOLVES = "SOLVES"
ADDRESSES = "SOLVES"
CAUSES = "CAUSES"
CONTRADICTS = "CONTRADICTS"
REPLACES = "SUPERSEDES"
RELATED_TO = "dropped"
SIMILAR_TO = "dropped"
BLOCKS = "dropped"
BUILDS_ON = "dropped"
DEPENDS_ON = "dropped"
FOLLOWS = "dropped"
