[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
hosting = ["github"]
pr-run-mode = "plan"
create-release = false
allow-dirty = ["ci"]
